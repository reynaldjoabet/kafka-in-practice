# Kafka broker. Rendered by scripts/kafka-entrypoint.sh: each placeholder (two @ signs around a name) is replaced with
# the value of an environment variable. ${file:...} is resolved by FileConfigProvider.

############################# Role #############################
process.roles=broker
node.id=@@NODE_ID@@
controller.quorum.voters=@@QUORUM_VOTERS@@
controller.listener.names=CONTROLLER
# Rack or availability zone: replicas of each partition are spread across racks, and
# consumers with a matching client.rack fetch from the nearest replica.
broker.rack=@@BROKER_RACK@@
replica.selector.class=org.apache.kafka.common.replica.RackAwareReplicaSelector

############################# Listeners #############################
# INTERNAL  broker-to-broker replication and admin tools. Mutual TLS.
# CLIENT    applications inside the network. SCRAM over TLS.
# EXTERNAL  applications outside the network (Docker Compose only). SCRAM over TLS.
# CONTROLLER is only used to reach the controllers, so it is not in `listeners`.
listeners=@@LISTENERS@@
advertised.listeners=@@ADVERTISED_LISTENERS@@
listener.security.protocol.map=CONTROLLER:SSL,INTERNAL:SSL,CLIENT:SASL_SSL,EXTERNAL:SASL_SSL
inter.broker.listener.name=INTERNAL

############################# Storage #############################
log.dirs=/var/lib/kafka/data

############################# Secrets #############################
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=/etc/kafka/secrets

############################# TLS #############################
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/node.p12
ssl.keystore.password=${file:/etc/kafka/secrets/node-credentials.properties:node.keystore.password}
ssl.key.password=${file:/etc/kafka/secrets/node-credentials.properties:node.keystore.password}
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/secrets/ca.crt
ssl.enabled.protocols=TLSv1.3,TLSv1.2
# Mutual TLS on INTERNAL and CONTROLLER; SASL listeners authenticate with SCRAM instead.
ssl.client.auth=required
listener.name.client.ssl.client.auth=none
listener.name.external.ssl.client.auth=none
ssl.principal.mapping.rules=RULE:^CN=[^,]+,OU=kafka-nodes,.*$/kafka-node/,RULE:^CN=([^,]+),.*$/$1/,DEFAULT

############################# SASL/SCRAM #############################
# Credentials live in the KRaft metadata log; create them with kafka-configs.sh
# (see scripts/init-cluster.sh).
sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.client.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
# Long-lived connections must re-authenticate hourly, so removed users lose access.
connections.max.reauth.ms=3600000

############################# Authorization #############################
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:kafka-node;User:admin
allow.everyone.if.no.acl.found=false

############################# Durability #############################
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
auto.create.topics.enable=false
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2

############################# Topic defaults #############################
num.partitions=6
log.retention.hours=168
log.segment.bytes=1073741824
# Reject records timestamped more than an hour in the future; they would pin
# segments against time-based retention.
log.message.timestamp.after.max.ms=3600000

############################# Threads #############################
# Size to the machine: raise num.io.threads while RequestHandlerAvgIdlePercent < 30%,
# and num.network.threads while NetworkProcessorAvgIdlePercent < 30%.
num.network.threads=@@NUM_NETWORK_THREADS@@
num.io.threads=@@NUM_IO_THREADS@@
num.replica.fetchers=2
# Faster log recovery after an unclean shutdown.
num.recovery.threads.per.data.dir=4
background.threads=10

############################# Groups #############################
# Wait a little for more members before the first rebalance of a new group.
group.initial.rebalance.delay.ms=3000

############################# Operations #############################
# Move leadership back to preferred replicas after restarts.
auto.leader.rebalance.enable=true
