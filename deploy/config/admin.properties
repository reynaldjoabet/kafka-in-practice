# Admin tools (kafka-topics.sh, kafka-acls.sh, ...) as User:admin, over mutual TLS on
# the brokers' INTERNAL listener. Used by scripts/init-cluster.sh and for operations:
#   kafka-topics.sh --bootstrap-server broker-1:9091 --command-config /etc/kafka/admin/admin.properties --list
security.protocol=SSL
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=/etc/kafka/secrets
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/admin.p12
ssl.keystore.password=${file:/etc/kafka/secrets/admin-credentials.properties:admin.keystore.password}
ssl.key.password=${file:/etc/kafka/secrets/admin-credentials.properties:admin.keystore.password}
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/secrets/ca.crt
