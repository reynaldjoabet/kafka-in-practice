# KRaft controller. Rendered by scripts/kafka-entrypoint.sh: each placeholder (two @ signs around a name) is replaced with
# the value of an environment variable. ${file:...} is resolved by FileConfigProvider.

############################# Role #############################
process.roles=controller
node.id=@@NODE_ID@@
# Static voter set: id@host:port of every controller.
controller.quorum.voters=@@QUORUM_VOTERS@@

############################# Listener #############################
# Controllers only ever talk to other controllers and to brokers. Clients never connect here.
listeners=CONTROLLER://0.0.0.0:9093
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SSL

############################# Storage #############################
log.dirs=/var/lib/kafka/data
metadata.log.dir=/var/lib/kafka/data

############################# Secrets #############################
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
config.providers.file.param.allowed.paths=/etc/kafka/secrets

############################# TLS (mutual) #############################
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/node.p12
ssl.keystore.password=${file:/etc/kafka/secrets/node-credentials.properties:node.keystore.password}
ssl.key.password=${file:/etc/kafka/secrets/node-credentials.properties:node.keystore.password}
ssl.truststore.type=PEM
ssl.truststore.location=/etc/kafka/secrets/ca.crt
ssl.client.auth=required
ssl.enabled.protocols=TLSv1.3
ssl.protocol=TLSv1.3
# Every node certificate (OU=kafka-nodes) maps to one principal, User:kafka-node.
ssl.principal.mapping.rules=RULE:^CN=[^,]+,OU=kafka-nodes,.*$/kafka-node/,RULE:^CN=([^,]+),.*$/$1/,DEFAULT

############################# Authorization #############################
# Brokers forward admin requests (CreateTopics, ACL changes) here, so the controllers
# must run the same authorizer and super users as the brokers.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:kafka-node;User:admin
allow.everyone.if.no.acl.found=false

############################# Liveness #############################
# Fence a broker that has not heartbeated for 9 s (default), and move its leaderships away.
broker.session.timeout.ms=9000
