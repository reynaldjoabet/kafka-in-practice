# Creates the application's SCRAM user, topics and ACLs as User:admin.
# Idempotent: to re-run, delete the job and apply again.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: apache/kafka
          command: ["/etc/kafka/scripts/init-cluster.sh"]
          env:
            - name: BOOTSTRAP_SERVERS
              value: >-
                kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local:9091,kafka-broker-1.kafka-broker-headless.kafka.svc.cluster.local:9091,kafka-broker-2.kafka-broker-headless.kafka.svc.cluster.local:9091
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx256m"
            - name: LOG_DIR
              value: /tmp
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: scripts, mountPath: /etc/kafka/scripts, readOnly: true }
            - { name: admin-config, mountPath: /etc/kafka/admin, readOnly: true }
            - { name: admin-tls, mountPath: /etc/kafka/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: scripts
          configMap: { name: kafka-scripts, defaultMode: 0555 }
        - name: admin-config
          configMap: { name: kafka-admin-config }
        - name: admin-tls
          secret: { secretName: kafka-admin-tls, defaultMode: 0440 }
        - name: tmp
          emptyDir: {}
